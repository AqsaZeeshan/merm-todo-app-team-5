version: '3.8'

services:
  backend:
    image: 373516853296.dkr.ecr.eu-north-1.amazonaws.com/todo-backend:latest
    container_name: backend
    ports:
      - "5000:5000"
    restart: always

  frontend:
    image: 373516853296.dkr.ecr.eu-north-1.amazonaws.com/todo-frontend:latest
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
